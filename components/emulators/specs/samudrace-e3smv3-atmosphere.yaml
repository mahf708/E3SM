# The atmosphere half of SamudrACE-E3SMv3, 1 degree Gaussian grid.
# Channel order is the traced checkpoint's tensor order
# (SamudrACE-E3SMv3/eatm/samudrace_atm_traced_cuda.pt and its _metadata.yaml).

name: samudrace-atmosphere

network:
  name: SamudrACE-E3SMv3
  timestep: 21600
  inputs: [LANDFRAC, OCNFRAC, ICEFRAC, PHIS, SOLIN, PS, TS,
           "T_{0..7}", "STW_{0..7}", "U_{0..7}", "V_{0..7}",
           Qat2m, Uat10m, Vat10m, Tat2m]
  outputs: [PS, TS, "T_{0..7}", "STW_{0..7}", "U_{0..7}", "V_{0..7}",
            LHFLX, SHFLX, surface_precipitation_rate,
            frozen_precipitation_rate, FLUS, FLUT, FLDS, FSDS, FSUS, FSUTOA,
            DTENDTTW, TAUX, TAUY,
            Qat2m, Uat10m, Vat10m, Tat2m]
  interval_mean_outputs: [LHFLX, SHFLX, surface_precipitation_rate,
                          frozen_precipitation_rate, FLUS, FLUT, FLDS, FSDS,
                          FSUS, FSUTOA, DTENDTTW, TAUX, TAUY]
  coupled_inputs: [LANDFRAC, OCNFRAC, ICEFRAC, TS]
  boundary_inputs: [PHIS]
  forcing_inputs: [SOLIN]

stepping: interpolate
initial_condition:
  # Coarsened surface fractions have NaN and fill values on part of the grid.
  zero_fill: [LANDFRAC, OCNFRAC, ICEFRAC]
  computed: [SOLIN]

operators:
  - operator: ace.surface_inputs
    coupler: {lfrac: imports.Sf_lfrac, ofrac: imports.Sf_ofrac,
              ifrac: imports.Sf_ifrac, merged_ts: imports.Sx_t}
    emulator_ts: upper.TS
    # SamudrACE: the emulated ocean's own ice fraction and SST.
    ocean: {ice_fraction: exchange.ocn.sea_ice_fraction, sst: exchange.ocn.sst}
    to: {landfrac: inputs.LANDFRAC, ocnfrac: inputs.OCNFRAC,
         icefrac: inputs.ICEFRAC, ts: inputs.TS}
  - operator: insolation
    channel: SOLIN
    orbit: {eccen: 0.016715, obliq: 23.4441, mvelp: 102.7}
  - operator: ace.surface_exports
    layer: near_surface
    from: {ps: state.PS, phis: inputs.PHIS,
           t_lowest: state.T_7, q_lowest: state.STW_7,
           u_lowest: state.U_7, v_lowest: state.V_7,
           t_2m: state.Tat2m, q_2m: state.Qat2m,
           u_10m: state.Uat10m, v_10m: state.Vat10m,
           flds: state.FLDS, fsds: state.FSDS, fsus: state.FSUS,
           precip: state.surface_precipitation_rate,
           frozen_precip: state.frozen_precipitation_rate,
           solin_now: aux.solin_now, solin_window: aux.solin_window}
    to: {z: exports.Sa_z, u: exports.Sa_u, v: exports.Sa_v,
         tbot: exports.Sa_tbot, ptem: exports.Sa_ptem, shum: exports.Sa_shum,
         pbot: exports.Sa_pbot, pslv: exports.Sa_pslv, dens: exports.Sa_dens,
         topo: exports.Sa_topo, lwdn: exports.Faxa_lwdn,
         rainc: exports.Faxa_rainc, rainl: exports.Faxa_rainl,
         snowc: exports.Faxa_snowc, snowl: exports.Faxa_snowl,
         swndr: exports.Faxa_swndr, swvdr: exports.Faxa_swvdr,
         swndf: exports.Faxa_swndf, swvdf: exports.Faxa_swvdf,
         swnet: exports.Faxa_swnet}
  # SamudrACE: the ocean is forced with the atmosphere's own fluxes.
  - operator: exchange.publish
    fields: {atm.TAUX: state.TAUX, atm.TAUY: state.TAUY,
             atm.surface_precipitation_rate: state.surface_precipitation_rate,
             atm.frozen_precipitation_rate: state.frozen_precipitation_rate,
             atm.FLUS: state.FLUS, atm.FSUS: state.FSUS,
             atm.FLDS: state.FLDS, atm.FSDS: state.FSDS,
             atm.LHFLX: state.LHFLX, atm.SHFLX: state.SHFLX}
    clip_min_zero: [atm.surface_precipitation_rate,
                    atm.frozen_precipitation_rate]

coupler:
  imports:
    - {name: Sf_lfrac, units: "1"}
    - {name: Sf_ofrac, units: "1"}
    - {name: Sf_ifrac, units: "1"}
    - {name: Sx_t, units: K}
  exports:
    - {name: Sa_z, units: m}
    - {name: Sa_u, units: m/s}
    - {name: Sa_v, units: m/s}
    - {name: Sa_tbot, units: K}
    - {name: Sa_ptem, units: K}
    - {name: Sa_shum, units: kg/kg}
    - {name: Sa_pbot, units: Pa}
    - {name: Sa_pslv, units: Pa}
    - {name: Sa_dens, units: kg/m3}
    - {name: Sa_topo, units: m}
    - {name: Faxa_lwdn, units: W/m2}
    - {name: Faxa_rainc, units: kg/m2/s}
    - {name: Faxa_rainl, units: kg/m2/s}
    - {name: Faxa_snowc, units: kg/m2/s}
    - {name: Faxa_snowl, units: kg/m2/s}
    - {name: Faxa_swndr, units: W/m2}
    - {name: Faxa_swvdr, units: W/m2}
    - {name: Faxa_swndf, units: W/m2}
    - {name: Faxa_swvdf, units: W/m2}
    - {name: Faxa_swnet, units: W/m2}
