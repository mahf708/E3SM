# The Samudra ocean's sea ice under a model atmosphere.  The ocean emulator
# still predicts the fraction; the surface over it balances its energy
# instead of following dice's prescribed season, because a model atmosphere
# reads the skin temperature and the prescribed one (254 K under 262 K air
# in January) drew 150-200 W/m2 of sensible heat from EAM's lowest level.

extends: samudrace-e3smv3-sea-ice.yaml
name: samudra-sea-ice-energy-balance

operators:
  - operator: sea_ice.surface
    ice_fraction: exchange.ocn.sea_ice_fraction
    skin: energy_balance
    ice_thickness: {north: 2.0, south: 1.0}
    snow_depth: 0.2
  # For a coupler-forced ocean's cell means: the ice surface's own fluxes and
  # the atmosphere's downward fields, which the coupler weights by the
  # open-water fraction before the ocean sees them.
  - operator: exchange.publish
    fields: {ice.Si_ifrac: exports.Si_ifrac, ice.Faii_lwup: exports.Faii_lwup,
             ice.Faii_lat: exports.Faii_lat, ice.Faii_sen: exports.Faii_sen,
             ice.Faii_swnet: exports.Faii_swnet,
             ice.Faii_taux: exports.Faii_taux, ice.Faii_tauy: exports.Faii_tauy,
             ice.Fioi_swpen: exports.Fioi_swpen,
             ice.Fioi_taux: exports.Fioi_taux, ice.Fioi_tauy: exports.Fioi_tauy,
             ice.Faxa_lwdn: imports.Faxa_lwdn, ice.Faxa_rain: imports.Faxa_rain,
             ice.Faxa_snow: imports.Faxa_snow,
             ice.Faxa_swvdr: imports.Faxa_swvdr, ice.Faxa_swndr: imports.Faxa_swndr,
             ice.Faxa_swvdf: imports.Faxa_swvdf, ice.Faxa_swndf: imports.Faxa_swndf}

coupler:
  imports:
    - {name: Sa_z, units: m}
    - {name: Sa_u, units: m/s}
    - {name: Sa_v, units: m/s}
    - {name: Sa_ptem, units: K}
    - {name: Sa_shum, units: kg/kg}
    - {name: Sa_dens, units: kg/m3}
    - {name: Sa_tbot, units: K}
    - {name: Faxa_swvdr, units: W/m2}
    - {name: Faxa_swndr, units: W/m2}
    - {name: Faxa_swvdf, units: W/m2}
    - {name: Faxa_swndf, units: W/m2}
    - {name: Faxa_lwdn, units: W/m2}
    - {name: Faxa_rain, units: kg/m2/s}
    - {name: Faxa_snow, units: kg/m2/s}
