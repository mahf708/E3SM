%YAML 1.1
---
driver_options:
  atmosphere_dag_verbosity_level: 5

time_stepping:
  time_step: ${ATM_TIME_STEP}
  run_t0: ${RUN_T0}  # YYYY-MM-DD-XXXXX
  number_of_steps: ${NUM_STEPS}

eamxx:
  atm_procs_list: [p3]
  p3:
    max_total_ni: 740.0e3
    do_prescribed_ccn: false
    use_hetfrz_classnuc: false
    use_warm_rain_emulator: true
    warm_rain_emulator_backend: ${BACKEND}
    warm_rain_emulator_file: ${CMAKE_CURRENT_SOURCE_DIR}/synthetic_warm_rain_mlp.txt
    warm_rain_emulator_kk_factor: 0.36
    py_module_name: p3_warm_rain_mlp_numpy
    py_module_path: ${CMAKE_CURRENT_SOURCE_DIR}

grids_manager:
  type: mesh_free
  grids_names: [physics]
  physics:
    type: point_grid
    number_of_global_columns:   8
    number_of_vertical_levels:  20

# Warm, cloudy and drizzling columns, inside the emulator's envelope
initial_conditions:
  T_mid: 285.0
  T_prev_micro_step: 285.0
  qv: 8.0e-3
  qv_prev_micro_step: 8.0e-3
  qc: 4.0e-4
  nc: 5.0e7
  qr: 2.0e-5
  nr: 1.0e4
  qi: 0.0
  qm: 0.0
  ni: 0.0
  bm: 0.0
  p_mid: 9.0e4
  p_dry_mid: 8.93e4
  pseudo_density: 1000.0
  pseudo_density_dry: 992.0
  cldfrac_tot: 0.6
  nc_nuceat_tend: 0.0
  nccn: 0.0
  ni_activated: 0.0
  inv_qc_relvar: 1.0
  precip_liq_surf_mass: 0.0
  precip_ice_surf_mass: 0.0
  hetfrz_immersion_nucleation_tend: 0.0
  hetfrz_contact_nucleation_tend: 0.0
  hetfrz_deposition_nucleation_tend: 0.0

scorpio:
  output_yaml_files: [output_${BACKEND}.yaml]
...
